 name: Build

 on:
   push:
     tags:
       - 'v*'
   workflow_dispatch:

 permissions:
   contents: write

 jobs:
   build-macos:
     runs-on: macos-latest
     steps:
       - uses: actions/checkout@v4

       - uses: actions/setup-node@v4
         with:
           node-version: 20
           cache: npm

       - name: Install dependencies
         run: npm ci

       - name: Build & Package
         env:
           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         run: npx electron-vite build && npx electron-builder --mac --publish always

   build-windows:
     runs-on: windows-latest
     steps:
       - uses: actions/checkout@v4

       - uses: actions/setup-node@v4
         with:
           node-version: 20
           cache: npm

       - name: Install dependencies
         run: npm ci

       - name: Build & Package
         env:
           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         run: npx electron-vite build && npx electron-builder --win --publish always

   build-linux:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4

       - uses: actions/setup-node@v4
         with:
           node-version: 20
           cache: npm

       - name: Install dependencies
         run: npm ci

       - name: Build & Package
         env:
           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         run: npx electron-vite build && npx electron-builder --linux AppImage --publish always
